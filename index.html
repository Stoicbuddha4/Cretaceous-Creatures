<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cretaceous Creatures</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creatures">
<meta name="theme-color" content="#125c8e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html{box-sizing:border-box;height:100%;background:#125c8e;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px system-ui,sans-serif}
[hidden]{display:none!important}
</style>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: an overhead island fills the whole screen; a folder-tab toy tray is docked at the bottom;
   one big roar button top right, small grown-up and zoom buttons top left. Single committed look. */
:root{
  --ink:#1b2a26;
  --paper:#fff6dc;
  --tray:#256048;
  --tray-deep:#163f30;
  --sun:#ffc93c;
  --hot:#f2542d;
  --grass:#6fbf4f;
  --sea:#2c9fd3;
  --display:'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --b:clamp(50px, min(14.2vw, 16vh), 124px);   /* every button is sized from this; a row that does not fit wraps onto a second line */
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--sea);color:var(--ink);font-family:var(--display);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#park{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%, rgba(8,36,66,0) 48%, rgba(8,36,66,.3) 100%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--paper);outline-offset:2px}

#name{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  max-width:calc(100% - 700px);box-sizing:border-box;
  background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:6px 22px 8px;text-align:center;pointer-events:none;
  box-shadow:0 5px 0 rgba(27,42,38,.35);
  animation:pop .28s cubic-bezier(.3,1.6,.5,1);
}
#nameText{display:block;font-weight:700;font-size:clamp(20px,3.4vw,34px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
#nameDiet{display:block;font-weight:500;font-size:clamp(12px,1.6vw,16px);letter-spacing:.02em;opacity:.75}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

#grown{position:absolute;top:14px;left:16px;display:flex;gap:8px}
.mini{
  position:relative;width:clamp(44px, 6vw, 56px);height:clamp(44px, 6vw, 56px);border-radius:50%;padding:0;
  background:rgba(255,246,220,.72);border:2.5px solid var(--ink);
  display:grid;place-items:center;
}
.mini svg{width:52%;height:52%;display:block}
.mini.pending::after{content:'';position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink)}
#ask{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:16px;background:rgba(10,30,40,.6)}
#bk{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(10,30,40,.6)}
#ask .card{box-sizing:border-box;max-width:min(520px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:22px 24px;box-shadow:0 8px 0 rgba(27,42,38,.5);text-align:center}
#bk .card{box-sizing:border-box;max-width:min(520px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:22px 24px;box-shadow:0 8px 0 rgba(27,42,38,.5);text-align:center}
#ask p{margin:0 0 10px;font-weight:700;font-size:clamp(19px,2.6vw,25px);line-height:1.2;text-wrap:balance}
#bk p{margin:0 0 10px;font-weight:700;font-size:clamp(19px,2.6vw,25px);line-height:1.2;text-wrap:balance}
#ask p.sub{font-weight:500;font-size:clamp(14px,1.8vw,17px);line-height:1.4;opacity:.85;margin-bottom:18px}
#bk p.sub{font-weight:500;font-size:clamp(14px,1.8vw,17px);line-height:1.4;opacity:.85;margin-bottom:18px}
#ask .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#bk .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#ask button{flex:1 1 200px;min-height:56px;padding:10px 16px;border-radius:18px;border:3px solid var(--ink);background:var(--sun);font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--ink)}
#bk button{flex:1 1 200px;min-height:56px;padding:10px 16px;border-radius:18px;border:3px solid var(--ink);background:var(--sun);font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--ink)}
#ask #askLocal{background:var(--paper)}
#bk .plain{background:var(--paper)}
#bk .row[hidden]{display:none}
[hidden]{display:none!important}
#ask button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#bk button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#snd[aria-pressed="false"] .wave{display:none}
#snd[aria-pressed="true"] .mute{display:none}
#clr i{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--hot) var(--p,0%), transparent 0);
  -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%);mask:radial-gradient(circle, transparent 58%, #000 60%)}

#roar{
  position:absolute;top:12px;right:16px;width:calc(var(--b)*.92);height:calc(var(--b)*.92);
  border-radius:50%;padding:0;background:var(--sun);border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);overflow:hidden;
}
#roar:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
#roar canvas{width:100%;height:100%;display:block;pointer-events:none}
#rm{
  position:absolute;right:calc(16px + var(--b)*.08);top:calc(12px + var(--b)*.92 + 18px);
  width:calc(var(--b)*.76);height:calc(var(--b)*.76);border-radius:50%;padding:0;
  background:var(--hot);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;
}
#rm svg{width:52%;height:52%;display:block;stroke:var(--paper)}
#rm:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#rm[aria-pressed="true"]{background:var(--sun);transform:translateY(4px);box-shadow:0 1px 0 var(--ink);animation:rmPulse .9s ease-in-out infinite}
#rm[aria-pressed="true"] svg{stroke:var(--ink)}
@keyframes rmPulse{50%{outline:6px solid rgba(242,84,45,.55);outline-offset:3px}}
@media (prefers-reduced-motion:reduce){#rm[aria-pressed="true"]{animation:none;outline:5px solid var(--hot);outline-offset:3px}}

#dock{
  position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;
}
#tabs{display:flex;gap:6px;pointer-events:auto;position:relative;z-index:1;margin-bottom:-3px;max-width:100%;align-items:flex-end}
.tab{
  flex:0 1 calc(var(--b)*.8);min-width:0;height:calc(var(--b)*.6);padding:0;
  border:3px solid var(--ink);border-bottom-color:var(--ink);border-radius:16px 16px 0 0;
  background:var(--tray-deep);opacity:.94;
}
.tab[aria-selected="true"]{background:var(--tray);border-bottom-color:var(--tray);opacity:1;height:calc(var(--b)*.68);margin-top:calc(var(--b)*-.08)}
.tab{position:relative}
.tab.need::after{content:'';position:absolute;top:-7px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--hot);border:3px solid var(--ink)}
.tab canvas,.item canvas{width:100%;height:100%;display:block;pointer-events:none}
#tray{
  position:relative;pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:100%;box-sizing:border-box;
  background:var(--tray);border:3px solid var(--ink);border-radius:26px;padding:10px 12px 15px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:none;
  box-shadow:0 6px 0 rgba(27,42,38,.4);
}
#tray::-webkit-scrollbar{display:none}
#tray.scrolly{touch-action:pan-x}
#tray.scrolly .item{touch-action:pan-x}
.item{
  flex:0 0 auto;width:var(--b);height:var(--b);padding:0;border-radius:22px;
  background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);touch-action:none;
}
.item.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.item.on{background:var(--sun);transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#tray.picking .item:not(.on){display:none}
#tray.bin{background:var(--hot)}
#tray.bin .item{opacity:.18}
#binIcon{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#binIcon svg{height:62%;width:auto}
#care{position:absolute;inset:0;z-index:5;background:#8fd3f2;touch-action:none}
#careCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#care.egg #careBar{display:none}
#bat{
  position:absolute;right:calc(16px + var(--b)*.08);top:calc(12px + var(--b)*.92 + 18px + var(--b)*.76 + 18px);
  width:calc(var(--b)*.76);height:calc(var(--b)*.76);border-radius:50%;padding:0;overflow:hidden;
  background:#ff9a3c;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
}
#bat canvas{width:100%;height:100%;display:block;pointer-events:none}
#bat:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#bat[aria-pressed="true"]{background:var(--sun);transform:translateY(4px);box-shadow:0 1px 0 var(--ink);animation:rmPulse .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#bat[aria-pressed="true"]{animation:none;outline:5px solid var(--hot);outline-offset:3px}}
#dig{
  position:absolute;right:calc(16px + var(--b)*.08);top:calc(12px + var(--b)*.92 + 18px + (var(--b)*.76 + 18px)*2);
  width:calc(var(--b)*.76);height:calc(var(--b)*.76);border-radius:50%;padding:0;overflow:hidden;
  background:#e2b266;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
}
#dig canvas{width:100%;height:100%;display:block;pointer-events:none}
#dig:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#chase{position:absolute;inset:0;z-index:6;background:#8fd3f2;touch-action:none}
#chaseCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#chaseBar{justify-content:space-between;padding:0 calc(16px + env(safe-area-inset-left,0px))}
#digsite{position:absolute;inset:0;z-index:6;background:#e5c58f;touch-action:none}
#digCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.item.locked{background:#e3d6b6}
#duel{position:absolute;inset:0;z-index:6;background:#8fd3f2;touch-action:none}
#duelCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cbtn[hidden]{display:none}
.cbtn.off{opacity:.5}
.cbtn.on{background:var(--sun)}
#careTop,#duelTop,#digTop,#chaseTop{position:absolute;top:14px;left:50%;transform:translateX(-50%);box-sizing:border-box;max-width:calc(100% - var(--b)*2 - 64px);text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:6px 20px 8px;box-shadow:0 5px 0 rgba(27,42,38,.35);pointer-events:none}
#careName,#duelName,#digName,#chaseName{display:block;font-weight:700;font-size:clamp(17px,3.6vw,36px);line-height:1.1;overflow-wrap:break-word;text-wrap:balance}
#careNeeds,#duelSub,#digSub,#chaseSub{display:block;font-weight:500;font-size:clamp(12px,1.7vw,17px);letter-spacing:.02em;opacity:.78}
#careClose,#duelClose,#digClose,#chaseClose{position:absolute;top:12px;right:16px;width:calc(var(--b)*.92);height:calc(var(--b)*.92);border-radius:50%;padding:0;background:var(--sun);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center}
#careClose:active,#duelClose:active,#digClose:active,#chaseClose:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
#careClose svg,#duelClose svg,#digClose svg,#chaseClose svg{width:52%;height:52%;display:block}
#careEnv{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:clamp(8px,2.2vw,22px);padding:0 12px;pointer-events:none}
#careEnv .cbtn{flex:0 1 calc(var(--b)*1.05)}
#careBar,#duelBar,#digBar,#chaseBar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:clamp(14px,4vw,44px);padding:0 16px;pointer-events:none}
.cbtn{pointer-events:auto;position:relative;flex:0 1 calc(var(--b)*1.25);min-width:0;aspect-ratio:1;border-radius:28px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:0}
.cbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.cbtn canvas{width:100%;height:100%;display:block;pointer-events:none}
.cbtn.need{background:#ffe9a8;animation:wantPulse 1s ease-in-out infinite}
.cbtn.need::after{content:'';position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;background:var(--hot);border:3px solid var(--ink)}
@keyframes wantPulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.cbtn.need{animation:none}}
@media (max-width:1100px){#name{top:calc(clamp(44px, 6vw, 56px) + 26px);max-width:calc(100% - var(--b)*2 - 40px)}}
@media (prefers-reduced-motion:reduce){#name{animation:none}}
</style>

<div id="app">
  <canvas id="park" aria-label="Dinosaur island seen from above. Tap a dinosaur to look after it. Drag paddocks and buildings to move them. Pinch to zoom."></canvas>
  <div id="vig"></div>
  <div id="name" hidden><span id="nameText"></span><span id="nameDiet"></span></div>
  <div id="grown">
    <button id="sav" class="mini" type="button" aria-label="Save" title="Save">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    </button>
    <button id="snd" class="mini" type="button" aria-label="Sound" aria-pressed="true" title="Sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1b2a26"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="clr" class="mini" type="button" aria-label="Hold to clear the island" title="Hold to clear the island">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.5 7V4.5h5V7M7 7l1 12.5h8L17 7M10.5 10.5v6M13.5 10.5v6"/></svg><i></i>
    </button>
    <button id="zout" class="mini" type="button" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button id="zin" class="mini" type="button" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="3" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg>
    </button>
  </div>
  <button id="roar" type="button" aria-label="Everybody roar"><canvas></canvas></button>
  <button id="rm" type="button" aria-label="Remove a paddock or building" aria-pressed="false" title="Remove a paddock or building"><svg viewBox="0 0 24 24" fill="none" stroke-width="4.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <button id="bat" type="button" aria-label="Dinosaur battle" aria-pressed="false" title="Dinosaur battle"><canvas></canvas></button>
  <button id="dig" type="button" aria-label="Dig for fossils" title="Dig for fossils"><canvas></canvas></button>
  <div id="dock">
    <div id="tabs" role="tablist" aria-label="Kinds of things to add"></div>
    <div id="tray" role="tabpanel">
      <div id="binIcon" hidden><svg viewBox="0 0 64 48" fill="none" stroke="#fff6dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 4v22M22 17l10 10 10-10"/><path d="M8 28v14h48V28"/></svg></div>
    </div>
  </div>
  <div id="ask" hidden role="dialog" aria-labelledby="askT">
    <div class="card">
      <p id="askT">A saved island was found in your account</p>
      <p class="sub">This device also has an island that was never saved to the account. Which one should open here? The other will be replaced.</p>
      <div class="row"><button id="askCloud" type="button">Use the saved island</button><button id="askLocal" type="button">Keep this device's island</button></div>
    </div>
  </div>
  <div id="bk" hidden role="dialog" aria-labelledby="bkT">
    <div class="card">
      <p id="bkT">Back up the island</p>
      <p class="sub" id="bkSub"></p>
      <div class="row" id="bkMain"><button id="bkSave" type="button">Back up to a file</button><button id="bkLoad" type="button" class="plain">Restore from a file</button></div>
      <div class="row" id="bkAsk" hidden><button id="bkYes" type="button">Restore it</button><button id="bkNo" type="button" class="plain">Cancel</button></div>
      <div class="row" style="margin-top:12px"><button id="bkClose" type="button" class="plain">Close</button></div>
      <input id="bkFile" type="file" accept=".json,application/json,text/plain" hidden>
    </div>
  </div>
  <div id="care" hidden role="dialog" aria-label="Look after this dinosaur">
    <canvas id="careCv" aria-label="Your dinosaur. Tap an egg ten times to hatch it. Tap a dinosaur to make it roar, or rub it to scrub it clean."></canvas>
    <div id="careTop"><span id="careName"></span><span id="careNeeds" aria-live="polite"></span></div>
    <button id="careClose" type="button" aria-label="Back to the island" title="Back to the island"><svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5l-7 7 7 7"/></svg></button>
    <div id="careEnv" hidden><button class="cbtn" type="button" data-env="forest" aria-label="Forest" title="Forest"><canvas></canvas></button><button class="cbtn" type="button" data-env="grass" aria-label="Grassland" title="Grassland"><canvas></canvas></button><button class="cbtn" type="button" data-env="swamp" aria-label="Swamp" title="Swamp"><canvas></canvas></button><button class="cbtn" type="button" data-env="desert" aria-label="Desert" title="Desert"><canvas></canvas></button><button class="cbtn" type="button" data-env="rocky" aria-label="Rocky hills" title="Rocky hills"><canvas></canvas></button></div>
    <div id="careBar">
      <button id="careHome" class="cbtn" type="button" aria-label="Change its home" title="Change its home"><canvas></canvas></button>
      <button id="careFeed" class="cbtn" type="button" aria-label="Feed" title="Feed"><canvas></canvas></button>
      <button id="carePlay" class="cbtn" type="button" aria-label="Play" title="Play"><canvas></canvas></button>
      <button id="careWash" class="cbtn" type="button" aria-label="Wash" title="Wash"><canvas></canvas></button>
      <button id="careMed" class="cbtn" type="button" aria-label="Medicine" title="Medicine" hidden><canvas></canvas></button>
    </div>
  </div>
  <div id="chase" hidden role="dialog" aria-label="Catch the dinosaur">
    <canvas id="chaseCv" aria-label="A dinosaur running away along a trail with your jeep behind it. Hold to drive, tap the dinosaur or the net button to throw the net."></canvas>
    <div id="chaseTop"><span id="chaseName"></span><span id="chaseSub" aria-live="polite"></span></div>
    <button id="chaseClose" type="button" aria-label="Back to the island" title="Back to the island"><svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5l-7 7 7 7"/></svg></button>
    <div id="chaseBar">
      <button id="chaseGo" class="cbtn" type="button" aria-label="Drive" title="Hold to drive"><canvas></canvas></button>
      <button id="chaseNet" class="cbtn" type="button" aria-label="Throw the net" title="Throw the net"><canvas></canvas></button>
    </div>
  </div>
  <div id="digsite" hidden role="dialog" aria-label="Dig for fossils">
    <canvas id="digCv" aria-label="A patch of ground with a dinosaur fossil buried in it. Rub the dirt away with your finger and tap big rocks to crack them."></canvas>
    <div id="digTop"><span id="digName"></span><span id="digSub" aria-live="polite"></span></div>
    <button id="digClose" type="button" aria-label="Back to the island" title="Back to the island"><svg viewBox="0 0 24 24" fill="none" stroke="#1b2a26" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5l-7 7 7 7"/></svg></button>
